<body>

<nav class="top">
  <div class="logo">~/<b>michaeldonovan</b>/pyloseq</div>
  <div class="links">

    <a href="https://github.com/alittleb3ar/pyloseq" target="_blank" rel="noopener">repo ↗</a>

<header class="hero short wrap">
  <p class="crumb"><a href="../index.html">work</a> / pyloseq</p>
  <span class="stamp"><span class="pulse"></span> active · Python</span>
  <h1>pyloseq <em>notebooks</em>.</h1>
  <p class="tag">A pure-Python port of the R package <a href="https://github.com/joey711/phyloseq"><b>phyloseq</b></a>. Each notebook reproduces the analyses and visualizations from a published microbiome study.</p>
</header>

<main class="wrap">
  <section class="sec">
    <div class="sec-head">
      <span class="tick">§</span>
      <h2>Reproductions</h2>
      <span class="meta" id="meta"></span>
    </div>
    <div class="entries" id="entries"></div>
  </section>
</main>

<footer>part of <a href="../index.html">the workbench</a> · <span id="yr"></span></footer>

<script>
/* =========================================================
   ADD A NOTEBOOK: append an object to this list.
   1. Export your notebook:
        jupyter nbconvert --to html my_analysis.ipynb
   2. Drop the .html in   phyloseq/notebooks/
   3. Add an entry below pointing 'file' at it.
   ========================================================= */
const NOTEBOOKS = [
   {
     title:"McMurdie & Holmes 2013",
     summary:"<em>phyloseq: An R Package for Reproducible Interactive Analysis and Graphics of Microbiome Census Data</em> — Core analyses covering all four bundled datasets: <strong>GlobalPatterns</strong>, <strong>enterotype</strong>, <strong>esophagus</strong>, and <strong>soilrep</strong>.",
     file:"notebooks/mcmurdie_holmes_2013.html",
     date:"2026-06-10",
     tags:["diversity","ordination","plotting"]
   },
];

document.getElementById('yr').textContent = new Date().getFullYear();

(function(){
  const wrap = document.getElementById('entries');
  document.getElementById('meta').textContent = NOTEBOOKS.length + (NOTEBOOKS.length===1?' notebook':' notebooks');

  if(NOTEBOOKS.length === 0){
    wrap.innerHTML =
      '<div class="empty">No notebooks published yet.<br>' +
      'Export one with <code>jupyter nbconvert --to html nb.ipynb</code>, ' +
      'drop it in <code>pyloseq/notebooks/</code>,<br>then add an entry to the ' +
      '<code>NOTEBOOKS</code> list in this file.</div>';
    return;
  }

  // newest first if dates are present
  const sorted = NOTEBOOKS.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  sorted.forEach((n,i)=>{
    const num = String(NOTEBOOKS.length - i).padStart(2,'0');
    const tags = (n.tags||[]).map(t=>`<span>${t}</span>`).join('');
    const a = document.createElement('a');
    a.className = 'entry';
    a.href = n.file;
    a.innerHTML =
      `<div class="idx">${num}</div>
       <div class="body">
         <h3>${n.title}</h3>
         <p>${n.summary||''}</p>
         ${tags?`<div class="tags">${tags}</div>`:''}
       </div>
       <div class="right">${n.date||''}<span class="arr">↗</span></div>`;
    wrap.appendChild(a);
  });
})();
</script>
<script src="../assets/reveal.js"></script>
</body>
</html>
